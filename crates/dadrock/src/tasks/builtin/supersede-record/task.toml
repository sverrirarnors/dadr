id = "supersede-record"
title = "Supersede record"
description = "Draft a successor candidate for an accepted DADR when the project decision has changed."
version = 1

[input]
mode = "form"

[[inputs]]
name = "record_id"
label = "Record to supersede"
type = "text"
required = true

[[inputs]]
name = "reason"
label = "Reason"
type = "textarea"
required = true

[requirements]
records = "one"
record_status = "accepted"
paths = "none"
notes = "required"
scope = "none"

[output]
kind = "supersession_proposal.v1"

[prompt]
system = "prompt.md"

[[tools]]
name = "dadrock.get_record"
mode = "read"
