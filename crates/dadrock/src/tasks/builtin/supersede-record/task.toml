id = "supersede-record"
title = "Supersede record"
description = "Draft a successor candidate that supersedes one or more accepted DADRs when the decision has changed."
version = 2

[input]
mode = "form"

[[inputs]]
name = "record_ids"
label = "Records to supersede"
type = "textarea"
required = true

[[inputs]]
name = "requested_changes"
label = "Requested changes"
type = "textarea"
required = true

[requirements]
records = "one_or_more"
record_status = "accepted"
paths = "none"
notes = "required"
scope = "none"

[output]
kind = "supersession_proposal.v1"

[prompt]
system = "prompt.md"

[[tools]]
name = "dadrock.get_record"
mode = "read"
