id = "edit-record"
title = "Edit record"
description = "Revise a candidate DADR before it is accepted or rejected."
version = 2

[input]
mode = "form"

[[inputs]]
name = "record_id"
label = "Candidate"
type = "text"
required = true

[[inputs]]
name = "requested_changes"
label = "Requested changes"
type = "textarea"
required = true

[requirements]
records = "one"
record_status = "candidate"
paths = "none"
notes = "required"
scope = "none"

[output]
kind = "record_revision.v1"

[prompt]
system = "prompt.md"

[[tools]]
name = "dadrock.get_record"
mode = "read"
