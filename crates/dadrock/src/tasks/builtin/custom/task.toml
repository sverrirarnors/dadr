id = "custom"
title = "Custom"
description = "Use a freeform prompt with selected records, files, folders, or notes when no dedicated DADR workflow fits."
version = 1

[input]
mode = "form"

[requirements]
records = "many"
record_status = "all"
paths = "optional"
notes = "required"
scope = "none"

[output]
kind = "markdown_report.v1"

[prompt]
system = "prompt.md"

[[tools]]
name = "dadrock.project_snapshot"
mode = "read"
