name: Release VS Code Extension

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-22.04
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      proceed: ${{ steps.resolve.outputs.proceed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: resolve
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -z "$TAG" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rust: aarch64-apple-darwin,      vsce: darwin-arm64, runner: macos-14 }
          - { rust: x86_64-apple-darwin,       vsce: darwin-x64,   runner: macos-14 }
          - { rust: x86_64-unknown-linux-gnu,  vsce: linux-x64,    runner: ubuntu-22.04 }
          - { rust: x86_64-pc-windows-msvc,    vsce: win32-x64,    runner: windows-2022, ext: .exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Build dadrock
        shell: bash
        run: cargo build --release --target ${{ matrix.rust }} -p dadrock --bin dadrock
      - name: Stage binary
        shell: bash
        run: |
          BIN=target/${{ matrix.rust }}/release/dadrock${{ matrix.ext }}
          make vscode-stage-binary BIN_PATH="$BIN"
      - name: Package VSIX
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version/ { print $2; exit }' Cargo.toml)
          make vscode-package-target TARGET=${{ matrix.vsce }} VERSION="$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.vsce }}
          path: editors/vscode/dist/*.vsix

  build-universal:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version/ { print $2; exit }' Cargo.toml)
          make vscode-package-universal VERSION="$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-universal
          path: editors/vscode/dist/*.vsix

  publish:
    needs: [gate, build, build-universal]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: cd editors/vscode && npm install --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: editors/vscode/dist
          merge-multiple: true
      # `if:` cannot test secrets, so this step reads the tokens and says
      # which registries to publish to. A registry whose token is not set is
      # skipped with a notice; when its token is set, a failed publish fails
      # the job.
      - name: Check registry tokens
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version/ { print $2; exit }' Cargo.toml)
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::notice::VSCE_PAT is not set: skipped publishing to the Visual Studio Marketplace"
            echo "marketplace=false" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-* ]]; then
            echo "::notice::$VERSION is a pre-release, which the Marketplace does not take: skipped publishing there"
            echo "marketplace=false" >> "$GITHUB_OUTPUT"
          else
            echo "marketplace=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::notice::OVSX_PAT is not set: skipped publishing to Open VSX"
            echo "openvsx=false" >> "$GITHUB_OUTPUT"
          else
            echo "openvsx=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: gh release upload "$TAG" editors/vscode/dist/*.vsix --clobber
      # !cancelled(): the release and the two registries are independent, so
      # a failure on one does not skip the others. Every VSIX is tried before
      # the step fails.
      - name: Publish to Marketplace
        if: ${{ !cancelled() && steps.tokens.outputs.marketplace == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          failed=0
          for v in editors/vscode/dist/*.vsix; do
            if ! npx --prefix editors/vscode vsce publish --no-dependencies --packagePath "$v" -p "$VSCE_PAT"; then
              echo "::error::Publishing $v to the Visual Studio Marketplace failed"
              failed=1
            fi
          done
          exit "$failed"
      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.tokens.outputs.openvsx == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        shell: bash
        run: |
          failed=0
          for v in editors/vscode/dist/*.vsix; do
            if ! npx --prefix editors/vscode ovsx publish "$v" -p "$OVSX_PAT"; then
              echo "::error::Publishing $v to Open VSX failed"
              failed=1
            fi
          done
          exit "$failed"
