[package]
name = "dadrock-desktop"
version = "0.0.2"
edition = "2021"
description = "Desktop app for dadrock: the DADR review UI in a native window."
license = "MIT OR Apache-2.0"
repository = "https://github.com/vincentarelbundock/dadr"
homepage = "https://vincentarelbundock.github.io/dadr"
authors = ["Vincent Arel-Bundock"]
publish = false

# A workspace of its own. Tauri links the system WebView (WebKitGTK on Linux),
# so keeping it out of the root workspace means `cargo test --workspace` and
# `cargo clippy --workspace` there never need those libraries.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
