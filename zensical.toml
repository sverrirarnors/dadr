[project]
docs_dir = "docs-src"
site_dir = "docs"
site_name = "DADR"
site_description = "Data Analysis Decision Records: a file-first format for capturing the choices behind an empirical analysis."
site_url = "https://vincentarelbundock.github.io/dadr"
repo_url = "https://github.com/vincentarelbundock/dadr"
repo_name = "vincentarelbundock/dadr"
extra_css = ["stylesheets/home.css"]
nav = [
  {"Home" = "index.md"},
  {"Making decisions" = "core.md"},
  {"Changing decisions" = "changing.md"},
  {"Project layout" = "layout.md"},
  {"Specification" = "specification.md"},
  {"Tags" = "tags.md"},
  {"DADRock" = [
    {"Installation" = "dadrock/index.md"},
    {"Web interface" = "dadrock/web.md"},
    {"Standalone app" = "dadrock/app.md"},
    {"Editors" = "dadrock/editors.md"},
    {"Command line" = "dadrock/cli.md"},
  ]},
  {"LLM agents" = "llms.md"},
  {"UUID v7" = "uuidv7.md"},
  {"Roadmap" = "roadmap.md"},
]

[project.theme]
logo = "assets/dadr_logo.svg"
favicon = "assets/dadr_logo.svg"
custom_dir = "docs-src/overrides"
font.text = "Source Serif 4"
font.code = "JetBrains Mono"
features = ["content.code.copy", "navigation.footer", "navigation.expand", "toc.follow"]

[project.theme.palette]
scheme = "default"
primary = "black"
accent = "red"
